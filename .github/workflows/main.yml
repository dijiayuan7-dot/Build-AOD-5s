name: Build AOD 5S

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project
        id: project
        run: |
          FILE=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$FILE" ]; then
            echo "找不到 settings.gradle"
            find . -maxdepth 5 -type f
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "项目目录：$DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AOD5S-build
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
